<title>Bytefight აკადემია</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a campus of four worlds. Hub = 2×2 world doors; a level = case/brief on the left, the workbench on the right. One calm light look with a colour per world. */
:root{
  --bg:#EDF1EE; --card:#FFFFFF; --soft:#F5F8F6; --line:#D3DCD7; --ink:#1D2A2E; --muted:#5A6A6E;
  --det:#B97A1E; --det-soft:#F7EBD7; --fac:#23927F; --fac-soft:#DCF0EA; --shop:#3573BE; --shop-soft:#DFEAF7; --maze:#7F57C2; --maze-soft:#ECE4F8;
  --ok:#2F8F5E; --ok-soft:#DFF1E6; --bad:#BF5246; --bad-soft:#F6E1DD; --warn:#A87A22; --warn-soft:#F6EBD3;
  --code:#F1F5F3; --code-dark:#18242A;
  --kw:#2F7368; --str:#9A6234; --type:#4F64A8; --num:#8A4F8C; --com:#86948E; --key:#3E62A8;
  --f-ui:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
select{font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
code,.mono{font-family:var(--f-mono)}
code{font-size:.86em;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:.04em .35em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(237,241,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;background:none;border:0;padding:0}
.logo{flex:none;width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.crumb{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:6px;min-width:0}
.crumb button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;white-space:nowrap}
.xp .bar{width:90px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fac),var(--shop),var(--maze))}
.snd{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.snd[aria-pressed="false"]{opacity:.5}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding-block:20px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.92rem;transition:transform .12s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.25)}
.btn:disabled{opacity:.45}
.btn.sm{padding:6px 12px;font-size:.84rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:.9rem}
.stars{display:inline-flex;gap:2px;color:#E3B341}
.stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.stars .off{color:#D3DCD7}

/* hub */
.hub{display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(1.7rem,4.6vw,2.6rem);letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.hero p{color:var(--muted);max-width:60ch;margin-top:8px}
.rank{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.rank b{font-size:1.15rem}
.rank .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.rank .track i{display:block;height:100%;background:linear-gradient(90deg,var(--fac),var(--shop),var(--maze))}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.world{--c:var(--det);--cs:var(--det-soft);position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s,box-shadow .2s;overflow:hidden}
.world:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(20,40,40,.4)}
.world.fac{--c:var(--fac);--cs:var(--fac-soft)} .world.shop{--c:var(--shop);--cs:var(--shop-soft)} .world.maze{--c:var(--maze);--cs:var(--maze-soft)}
.world .art{width:120px;height:120px;border-radius:14px;background:var(--cs);display:grid;place-items:center}
.world .art svg{width:96px;height:96px}
.world h2{font-size:1.2rem;font-weight:800}
.world .tg{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.world .tg span{font-size:.74rem;font-weight:600;color:var(--c);background:var(--cs);border-radius:999px;padding:2px 9px}
.world p{color:var(--muted);font-size:.9rem}
.world .wprog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.84rem;color:var(--muted)}
.world .wprog .bar{flex:1;height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.world .wprog .bar i{display:block;height:100%;background:var(--c)}

/* world map */
.wmap{display:flex;flex-direction:column;gap:18px}
.whead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.whead .art{width:72px;height:72px;border-radius:14px;display:grid;place-items:center}
.whead .art svg{width:58px;height:58px}
.whead h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:800}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lv{--c:var(--det);--cs:var(--det-soft);display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;min-width:0}
.lv .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cs);color:var(--c);font-weight:800;font-family:var(--f-mono)}
.lv b{font-size:1rem}
.lv small{color:var(--muted);font-size:.82rem}
.lv .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv:not(:disabled):hover{border-color:var(--c)}
.lv:disabled{opacity:.5}
.lv:disabled .n{background:var(--line);color:var(--muted)}
.lv.done{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}

/* level shell */
.lhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.lhead .tt{flex:1;min-width:0}
.lhead h1{font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:800;line-height:1.25}
.split{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:.95rem;font-weight:800}
.story{font-size:.95rem}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.goal b{display:block}
.hintbox{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:.88rem;color:#6B4C12}
.fb{border-radius:12px;padding:10px 12px;font-size:.9rem;display:none}
.fb.show{display:block}
.fb.bad{background:var(--bad-soft);color:#7E3128}
.fb.ok{background:var(--ok-soft);color:#1E5B3B}
.fb b{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
pre.code{margin:0;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.7;white-space:pre}
.t-kw{color:var(--kw);font-weight:600} .t-str{color:var(--str)} .t-type{color:var(--type)} .t-num{color:var(--num)} .t-com{color:var(--com);font-style:italic} .t-key{color:var(--key)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:none;padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.76rem;background:var(--soft);font-family:var(--f-mono)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.out td{opacity:.32}
tr.in td{background:color-mix(in srgb,var(--c, var(--det)) 9%,transparent)}
tr.chg td{background:var(--ok-soft)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 9px}

/* detective */
.det{--c:var(--det);--cs:var(--det-soft)}
.paper{background:#FFFDF8;border:1px solid #E8DCC4;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 #E8DCC4,0 2px 0 #F3EBDD}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.clues li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--det);margin-top:.5em;flex:none}
.qed{background:var(--code-dark);color:#DDE7E3;border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:.84rem;line-height:2;overflow-x:auto}
.qed .ln{display:flex;align-items:center;gap:4px;white-space:nowrap}
.qed .ind{display:inline-block;width:2.2em;flex:none}
.qed .m{color:#F2C46D} .qed .k{color:#7FC8B8} .qed .s{color:#E9B48A} .qed .p{color:#9AA9A4}
.qed select{background:#24343B;color:#F4F7F5;border:1px solid #3A4E56;border-radius:6px;padding:1px 4px;font-family:var(--f-mono);font-size:.82rem}
.qed .x{margin-left:8px;background:none;border:1px solid #3A4E56;color:#C9D5D1;border-radius:6px;padding:0 7px;font-size:.78rem;line-height:1.6}
.qed .x:hover{border-color:#E9B48A;color:#E9B48A}
.opbtn{font-family:var(--f-mono);font-size:.8rem;padding:6px 10px;border-radius:9px;border:1px dashed color-mix(in srgb,var(--c) 60%,var(--line));background:var(--cs);color:color-mix(in srgb,var(--c) 70%,#000);font-weight:600}
.opbtn:disabled{opacity:.4}
.qres{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:62px;background:var(--soft)}
.qres .big{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.err-x{font-family:var(--f-mono);font-size:.82rem;color:var(--bad)}

/* factory */
.fac{--c:var(--fac);--cs:var(--fac-soft)}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reqs li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.reqs li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:.7rem;color:#fff}
.reqs li.ok i{background:var(--ok);border-color:var(--ok)}
.reqs li.ok i::after{content:"✓"}
.ctabs{display:flex;gap:6px;flex-wrap:wrap}
.ctab{font-family:var(--f-mono);font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.ctab[aria-pressed="true"]{background:var(--card);border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.bp{background:var(--code-dark);color:#DDE7E3;border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:.84rem;line-height:1.9;overflow-x:auto}
.bp .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;white-space:nowrap}
.bp select{background:#24343B;color:#F4F7F5;border:1px solid #3A4E56;border-radius:6px;padding:1px 4px;font-family:var(--f-mono);font-size:.82rem}
.bp .ifc{background:#24343B;color:#9AA9A4;border:1px dashed #3A4E56;border-radius:6px;padding:0 7px;font-family:var(--f-mono);font-size:.8rem}
.bp .ifc[aria-pressed="true"]{color:#7FC8B8;border-style:solid;border-color:#7FC8B8}
.bp .mem{display:flex;align-items:center;gap:8px;padding-left:2.2em;white-space:nowrap}
.bp .mem .x{background:none;border:1px solid #3A4E56;color:#C9D5D1;border-radius:6px;padding:0 7px;font-size:.78rem;line-height:1.6}
.bp .pre{opacity:.7}
.bp .empty{padding-left:2.2em;color:#7C8C87;font-style:italic}
.palette{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:var(--cs);font-family:var(--f-mono);font-size:.8rem;min-width:0}
.part span{overflow-wrap:anywhere;white-space:pre-wrap}
.part:disabled{opacity:.4}
.part .plus{flex:none;width:22px;height:22px;border-radius:7px;background:var(--card);display:grid;place-items:center;font-weight:700;color:var(--c)}
.console{background:#101A1F;color:#CFE0DA;border-radius:12px;padding:10px 12px;font-family:var(--f-mono);font-size:.8rem;line-height:1.6;display:flex;flex-direction:column;gap:6px;min-height:46px}
.console .e{color:#FF9C8C} .console .w{color:#F2C46D} .console .o{color:#8FE0B5}
.console .ka{font-family:var(--f-ui);color:#AFC0BA;font-size:.82rem}
.robots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:linear-gradient(180deg,#E6F2EE,#F7FAF8);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:170px;align-items:flex-end}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px}
.rb svg{width:120px;height:140px;overflow:visible}
.rb small{font-family:var(--f-mono);font-size:.76rem;font-weight:600}
.rb .bub{font-size:.76rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 8px;opacity:0;transition:opacity .3s}
.rb.live .bub{opacity:1}
.rb.live svg{animation:bob 1s ease-in-out infinite}
.rb.live .prop{animation:spin .25s linear infinite;transform-box:fill-box;transform-origin:center}
.rb.live .spark{animation:blink .3s steps(2) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

/* shop */
.shop{--c:var(--shop);--cs:var(--shop-soft)}
.ticket{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.ticket .msg{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:.93rem}
.ticket b{font-size:.84rem}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--ok)} .dots i.cur{background:var(--shop);box-shadow:0 0 0 3px var(--shop-soft)}
.reqb{display:flex;flex-direction:column;gap:10px}
.mseg{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{font-family:var(--f-mono);font-weight:600;font-size:.84rem;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.mbtn[aria-pressed="true"]{color:#fff}
.mbtn.GET[aria-pressed="true"]{background:#2F8F5E;border-color:#2F8F5E} .mbtn.POST[aria-pressed="true"]{background:#3573BE;border-color:#3573BE}
.mbtn.PUT[aria-pressed="true"]{background:#A87A22;border-color:#A87A22} .mbtn.DELETE[aria-pressed="true"]{background:#BF5246;border-color:#BF5246}
.url{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.9rem;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
.url select{font-family:var(--f-mono);font-size:.86rem;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:1px 4px}
.bodies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bodyc{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--code);padding:0;overflow:hidden;min-width:0}
.bodyc pre{margin:0;padding:10px 12px;font-family:var(--f-mono);font-size:.76rem;line-height:1.6;white-space:pre;overflow-x:auto}
.bodyc .bh{display:block;font-size:.74rem;font-weight:700;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.bodyc[aria-pressed="true"]{border-color:var(--shop);box-shadow:0 0 0 2px var(--shop-soft)}
.bodyc[aria-pressed="true"] .bh{color:var(--shop)}
.resp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.resp .rh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);font-size:.86rem}
.resp pre{margin:0;padding:10px 12px;font-family:var(--f-mono);font-size:.78rem;line-height:1.6;max-height:240px;overflow:auto;white-space:pre}
.st{font-family:var(--f-mono);font-weight:700;border-radius:6px;padding:1px 8px;color:#fff}
.st.s2{background:var(--ok)} .st.s4{background:var(--bad)}
.statq{display:flex;flex-wrap:wrap;gap:8px}
.statq button{font-family:var(--f-mono);font-weight:700;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;gap:0}
.statq button small{font-family:var(--f-ui);font-weight:500;color:var(--muted);font-size:.74rem}
.reqline{font-family:var(--f-mono);font-size:.9rem;background:var(--code-dark);color:#DDE7E3;border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}

/* maze */
.maze{--c:var(--maze);--cs:var(--maze-soft)}
.grid-wrap{display:flex;justify-content:center;background:#1C2530;border-radius:14px;padding:12px}
.grid-wrap svg{width:100%;max-width:460px;height:auto;display:block}
.robot{transition:transform .22s ease}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.blk{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:7px 10px;border-radius:9px;border:1px solid transparent;color:#fff}
.blk.a{background:#7F57C2} .blk.t{background:#3573BE} .blk.l{background:#23927F} .blk.c{background:#B97A1E}
.prog{background:var(--code-dark);color:#DDE7E3;border-radius:12px;padding:10px 12px;font-family:var(--f-mono);font-size:.84rem;line-height:1.85;overflow-x:auto;min-height:120px}

    } else if (st.op === 'OrderBy' || st.op === 'OrderByDescending') {

      cur = cur.slice().sort((x, y) => { const a = getF(x, st.f), b = getF(y, st.f); return (a > b ? 1 : a < b ? -1 : 0) * k; });

    + '<div class="panel"><h3>შენი LINQ query</h3><div class="qed" id="qed"></div><div class="row" id="ops"></div>'

        void isBool;

      else out.innerHTML = '<span class="note">' + r.v.length + ' მნიშვნელობა</span><div class="chips">' + r.v.map(v => '<span class="chip mono">' + esc(lit(v)) + '</span>').join('') + '</div>';
    } else if (r.v && typeof r.v === 'object') out.innerHTML = '<span class="note">ერთი ობიექტი</span><pre class="code">' + jhl(JSON.stringify(r.v, null, 2)) + '</pre>';
    else out.innerHTML = '<span class="note">' + (typeof r.v === 'number' ? 'int' : 'string') + '</span><span class="big">' + esc(lit(r.v)) + '</span>';
    const keep = new Set(((r.objs) || lv.data).map(d => d.Name));
    const dv = $('#dview', stage);
    if (view === 'table') {
      dv.innerHTML = '<div class="tbl-wrap"><table><thead><tr>' + fields.map(f => '<th>' + f + '</th>').join('') + '</tr></thead><tbody>' + lv.data.map(d => '<tr class="' + (steps.length ? (keep.has(d.Name) ? 'in' : 'out') : '') + '">' + fields.map(f => { const v = getF(d, f); return '<td class="' + (typeof v === 'number' ? 'num' : '') + '">' + esc(String(v)) + '</td>'; }).join('') + '</tr>').join('') + '</tbody></table></div>';
    } else dv.innerHTML = '<pre class="code" style="max-height:340px">' + jhl(JSON.stringify(lv.data, null, 2)) + '</pre>';

  function submit(){

const memOf = (cls, id) => { const d = MEM[id]; return Object.assign({id}, d, {code:d.code.replaceAll('{C}', cls), name:(d.name || '').replace('{C}', cls)}); };

const hasMem = (m, c, id) => !!m[c] && m[c].members.includes(id);

function compileModel(lv, m){

    for (const x of list) if (x.err) errors.push([x.err[0], x.err[1].replaceAll('{C}', c.name), x.err[2]]);
    const seen = {};
    for (const x of list) {
      const key = x.kind === 'prop' || x.kind === 'field' ? 'v:' + x.name : x.kind + ':' + x.name + '(' + (x.params || '') + ')';
      if (seen[key]) {
        if (x.kind === 'ctor') errors.push(['CS0111', "Type '" + c.name + "' already defines a member called '" + c.name + "' with the same parameter types", 'ერთნაირი პარამეტრებით ორი კონსტრუქტორი ვერ იარსებებს.']);
        else errors.push(['CS0102', "The type '" + c.name + "' already contains a definition for '" + x.name + "'", 'ერთ კლასში ორ წევრს ერთი სახელი ვერ ექნება.']);

      seen[key] = 1;
    }
    const baseList = cm.base ? chainMems(m, cm.base) : [];

        const bm = baseList.find(b => b.kind === 'method' && b.name === x.name && (b.params || '') === (x.params || ''));

      } else if (cm.base && x.kind !== 'ctor') {

function codeOf(lv, m){
  let out = '';
  const usedIf = [...new Set(lv.classes.flatMap(c => c.ifaces || []))];
  for (const i of usedIf) out += 'interface ' + i + '\n{\n    ' + IFACE_SIG[i] + '\n}\n\n';
  for (const c of lv.classes) {
    const cm = m[c.name], heads = [cm.base, ...cm.ifaces].filter(Boolean);
    out += 'class ' + c.name + (heads.length ? ' : ' + heads.join(', ') : '') + '\n{\n';
    const list = mems(m, c.name);
    out += list.map(x => x.code.split('\n').map(l => '    ' + l).join('\n')).join('\n\n') + (list.length ? '\n' : '');
    out += '}\n\n';
  }
  if (lv.run) out += '// საწარმოო ხაზი\n' + lv.run + '\n';
  return out.trim();
}

  }

  }
  function simulate(){
    const w = {y:start.y, x:start.x, d:lv.dir, gems:new Set(gems0), steps:[], err:null, win:false, done:false, n:0};
    const cell = (y, x) => (grid[y] && grid[y][x]) || '#';
    const ahead = () => { const [dy, dx] = DIRS[w.d]; return cell(w.y + dy, w.x + dx); };
    const atGoal = () => cell(w.y, w.x) === 'G';
    const rec = (id, t) => w.steps.push({id, t, y:w.y, x:w.x, d:w.d, gems:new Set(w.gems)});
    const tick = () => { if (++w.n > 300) { w.err = 'loop'; w.done = true; } };
    const runList = list => { for (const n of list) { if (w.done) return; exec(n); } };
    function exec(n){
      tick(); if (w.done) return;
      if (n.t === 'move') { if (ahead() === '#') { rec(n.id, 'bump'); w.err = 'wall'; w.done = true; return; } const [dy, dx] = DIRS[w.d]; w.y += dy; w.x += dx; rec(n.id, 'move'); if (atGoal() && !w.gems.size) { w.win = true; w.done = true; } }
      else if (n.t === 'left') { w.d = (w.d + 3) % 4; rec(n.id, 'turn'); }
      else if (n.t === 'right') { w.d = (w.d + 1) % 4; rec(n.id, 'turn'); }
      else if (n.t === 'collect') { const k = w.y + ',' + w.x; if (!w.gems.has(k)) { rec(n.id, 'empty'); w.err = 'empty'; w.done = true; return; } w.gems.delete(k); rec(n.id, 'gem'); }
      else if (n.t === 'repeat') { for (let i = 0; i < n.n && !w.done; i++) runList(n.body); }
      else if (n.t === 'while') { let g = 0; while (!atGoal() && !w.done) { if (++g > 200 || !n.body.length) { w.err = 'loop'; w.done = true; return; } runList(n.body); } }
      else if (n.t === 'if') { const c = n.c === 'wall' ? ahead() === '#' : n.c === 'path' ? ahead() !== '#' : w.gems.has(w.y + ',' + w.x); rec(n.id, 'check'); runList(c ? n.body : n.els); }
    }
    runList(prog);
    if (!w.done && !w.win) w.err = atGoal() ? 'gems' : 'nogoal';
    return w;
  }
  function run(){
    if (running) return;
    const res = simulate(); running = true; draw(); resetBot();
    const fb = $('#fb', stage); fb.className = 'fb';
    const trail = [];
    let i = 0;
    const stepMs = Math.max(80, Math.min(260, Math.round(4200 / Math.max(1, res.steps.length))));
    const timer = setInterval(() => {
      $$('.ln.run', stage).forEach(l => l.classList.remove('run'));
      if (i >= res.steps.length) { clearInterval(timer); running = false; finish(res); return; }
      const s = res.steps[i++];
      state.y = s.y; state.x = s.x; state.d = s.d; state.gems = s.gems;
      if (s.t === 'move') { trail.push({y:s.y, x:s.x}); sfx.step(); }
      if (s.t === 'gem') sfx.add();
      drawGrid(trail);
      const ln = $('[data-ln="' + s.id + '"]', stage); if (ln) ln.classList.add('run');
    }, stepMs);
  }
  function finish(res){
    draw();
    const fb = $('#fb', stage);
    if (res.win) {
      sfx.ok(); fb.className = 'fb show ok'; fb.innerHTML = '<b>მიზანი მიღწეულია!</b>';
      const st = Math.max(1, 3 - Math.min(2, fails + (count(prog) > lv.opt ? 1 : 0) + (hintShown ? 1 : 0)));
      setTimeout(() => win('maze', idx, st, lv.learn), 600); return;
    }
    fails++; sfx.bad();
    const msg = {wall:'რობოტი კედელს შეეჯახა. ნახე, რომელ ბრძანებაზე გაჩერდა.', nogoal:'ბრძანებები დასრულდა, დროშამდე კი ვერ მივიდა.', gems:'დროშამდე მივიდა, მაგრამ ყველა ბრილიანტი არ აუღია.', empty:'`Collect()` ცარიელ უჯრაზე გამოიძახე: აქ ბრილიანტი არ არის.', loop:'უსასრულო ციკლი! პირობა არასდროს გახდა false. შეამოწმე, რობოტი წინ მიიწევს თუ არა ციკლის შიგნით.'}[res.err];
    fb.className = 'fb show bad'; fb.innerHTML = '<b>ჯერ არა</b>' + fmt(msg);
    setTimeout(() => { if (!running) resetBot(); }, 1400);
  }
  resetBot(); draw();
}

  {id:'det', cls:'', name:'კოდის დეტექტივი', topics:['LINQ', 'JSON', 'ლოგიკა'], desc:'ამოხსენი საქმეები: ეჭვმიტანილების JSON-ს LINQ-ით ფილტრავ, ალაგებ და ითვლი.', levels:DET_LEVELS, mount:mountDetective, c:'var(--det)', cs:'var(--det-soft)'},
  {id:'fac', cls:'fac', name:'რობოტების ქარხანა', topics:['OOP', 'კლასები', 'ინტერფეისები'], desc:'ააწყე კლასები შეკვეთების მიხედვით. სწორად აწყობილი რობოტი ცოცხლდება, კომპილატორი კი შეცდომებს გიხსნის.', levels:FAC_LEVELS, mount:mountFactory, c:'var(--fac)', cs:'var(--fac-soft)'},
  {id:'shop', cls:'shop', name:'ციფრული მაღაზია', topics:['CRUD', 'HTTP', 'JSON'], desc:'იყავი მაღაზიის API: GET, POST, PUT, DELETE, სწორი JSON და სტატუს კოდები.', levels:SHOP_LEVELS, mount:mountShop, c:'var(--shop)', cs:'var(--shop-soft)'},
  {id:'maze', cls:'maze', name:'ლოგიკის ლაბირინთი', topics:['ალგორითმები', 'ციკლები', 'პირობები'], desc:'დააპროგრამე რობოტი ბლოკებით. ბლოკები შეზღუდულია, ამიტომ ციკლებსა და პირობებს თვითონ აღმოაჩენ.', levels:MAZE_LEVELS, mount:mountMaze, c:'var(--maze)', cs:'var(--maze-soft)'},
];
const W = id => WORLDS.find(w => w.id === id);

/* =================== router & screens =================== */
let view = {s:'hub'};
function go(v){ view = v; sfx.click(); render(); scrollTo({top:0, behavior:'smooth'}); }
$('#go-hub').addEventListener('click', () => go({s:'hub'}));
function drawTop(){
  const st = totalStars(), max = WORLDS.reduce((a, w) => a + w.levels.length * 3, 0), r = rankOf(st);
  $('#xp-txt').textContent = st + ' ★ · ' + r.name;
  $('#xp-bar').style.width = (st / max * 100) + '%';
  const cr = $('#crumb');
  if (view.s === 'hub') cr.innerHTML = '';
  else if (view.s === 'world') cr.innerHTML = '<span>/</span><span>' + esc(W(view.w).name) + '</span>';
  else cr.innerHTML = '<span>/</span><button id="cr-w">' + esc(W(view.w).name) + '</button><span>/</span><span>დონე ' + (view.i + 1) + '</span>';
  const cw = $('#cr-w'); if (cw) cw.addEventListener('click', () => go({s:'world', w:view.w}));
}
function render(){
  drawTop();
  const v = $('#view');
  if (view.s === 'hub') {
    const st = totalStars(), r = rankOf(st);
    v.innerHTML = '<section class="hub"><div class="hero"><div><span class="eyebrow">ისწავლე თამაშით</span><h1>ოთხი სამყარო, ერთი მიზანი: იაზროვნო როგორც პროგრამისტი</h1><p>თითოეული სამყარო ერთ თემას ასწავლის: LINQ და JSON, OOP, CRUD და API, ალგორითმები. გაიარე დონეები თანმიმდევრობით, შეაგროვე ვარსკვლავები და აიმაღლე რანგი.</p></div>'
      + '<div class="rank"><span class="eyebrow">შენი რანგი</span><b>' + esc(r.name) + '</b><div class="track"><i style="width:' + (r.next ? ((st - r.at) / (r.next[0] - r.at) * 100) : 100) + '%"></i></div><span class="note">' + (r.next ? st + ' ★ · შემდეგი რანგი „' + esc(r.next[1]) + '" ' + r.next[0] + ' ★-ზე' : 'მაქსიმალური რანგი!') + '</span></div></div>'
      + '<div class="worlds">' + WORLDS.map(w => { const got = w.levels.reduce((a, _, i) => a + starsOf(w.id, i), 0), mx = w.levels.length * 3; return '<button class="world ' + w.cls + '" data-w="' + w.id + '"><span class="art">' + ART[w.id] + '</span><span><h2>' + esc(w.name) + '</h2><span class="tg">' + w.topics.map(t => '<span>' + esc(t) + '</span>').join('') + '</span><p>' + esc(w.desc) + '</p><span class="wprog"><span class="bar"><i style="width:' + (got / mx * 100) + '%"></i></span>' + got + ' / ' + mx + ' ★</span></span></button>'; }).join('') + '</div></section>';
    $$('[data-w]', v).forEach(b => b.addEventListener('click', () => go({s:'world', w:b.dataset.w})));
  } else if (view.s === 'world') {
    const w = W(view.w);
    v.innerHTML = '<section class="wmap"><div class="whead"><span class="art" style="background:' + w.cs + '">' + ART[w.id] + '</span><div><span class="eyebrow">' + w.topics.join(' · ') + '</span><h1>' + esc(w.name) + '</h1><p class="note">' + esc(w.desc) + '</p></div></div>'
      + '<div class="levels">' + w.levels.map((l, i) => { const st = starsOf(w.id, i), un = unlocked(w.id, i); return '<button class="lv ' + (st ? 'done' : '') + '" style="--c:' + w.c + ';--cs:' + w.cs + '" data-i="' + i + '"' + (un ? '' : ' disabled') + '><span class="row"><span class="n">' + (i + 1) + '</span>' + (un ? starsHTML(st) : '<span class="note">დაკეტილია</span>') + '</span><b>' + esc(l.title) + '</b><small>' + esc(l.concept) + '</small></button>'; }).join('') + '</div>'
      + '<div><button class="btn" id="back">← ყველა სამყარო</button></div></section>';
    $$('[data-i]', v).forEach(b => b.addEventListener('click', () => go({s:'level', w:w.id, i:Number(b.dataset.i)})));
    $('#back', v).addEventListener('click', () => go({s:'hub'}));
  } else {
    const w = W(view.w), lv = w.levels[view.i];
    v.innerHTML = '<div class="lhead"><button class="btn sm" id="back">←</button><div class="tt"><span class="eyebrow">' + esc(w.name) + ' · დონე ' + (view.i + 1) + ' / ' + w.levels.length + ' · ' + esc(lv.concept) + '</span><h1>' + esc(lv.title) + '</h1></div>' + starsHTML(starsOf(w.id, view.i)) + '</div><div id="stage"></div>';
    $('#back', v).addEventListener('click', () => go({s:'world', w:w.id}));
    w.mount($('#stage', v), lv, view.i);
  }
}
function win(wid, i, st, learn){
  saveStars(wid, i, st); sfx.win(); drawTop();
  const w = W(wid), hasNext = i + 1 < w.levels.length, m = $('#modal');
  m.innerHTML = '<div class="mcard" role="dialog" aria-modal="true"><div class="bigstars">' + [0, 1, 2].map(k => STAR.replace('<svg', '<svg class="' + (k < st ? 'on' : '') + '"')).join('') + '</div><h2>' + (st === 3 ? 'იდეალურია!' : st === 2 ? 'კარგია!' : 'გაიარე!') + '</h2>'
    + '<div class="learned"><b>რა ისწავლე</b>' + fmt(learn) + '</div>'
    + (st < 3 ? '<p class="note" style="text-align:center">3 ვარსკვლავისთვის: შეცდომის, მინიშნებისა და ზედმეტი ნაბიჯის გარეშე.</p>' : '')
    + '<div class="row" style="justify-content:center"><button class="btn" id="m-retry">თავიდან</button><button class="btn" id="m-world">სამყაროში</button>' + (hasNext ? '<button class="btn primary" id="m-next">შემდეგი დონე →</button>' : '<button class="btn primary" id="m-hub">სხვა სამყარო →</button>') + '</div></div>';
  m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ''; };
  $('#m-retry', m).addEventListener('click', () => { close(); go({s:'level', w:wid, i}); });
  $('#m-world', m).addEventListener('click', () => { close(); go({s:'world', w:wid}); });
  const n = $('#m-next', m); if (n) n.addEventListener('click', () => { close(); go({s:'level', w:wid, i:i + 1}); });
  const h = $('#m-hub', m); if (h) h.addEventListener('click', () => { close(); go({s:'hub'}); });
}
render();
