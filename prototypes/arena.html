<title>Bytefight არენა</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Russo+One&display=swap">
<style>
/* Layout: a sticky night arena on top (the fight), a calm light deck under it (the thinking). One deliberate look in every theme. */
:root{
  --panel:#E7EEEA; --card:#FFFFFF; --line:#D0DAD5; --ink:#1D2A2E; --muted:#5A6A6E; --soft:#F3F7F5;
  --night:#14222B; --hud-ink:#EAF2EF;
  --p1:#2FB39F; --p2:#6683E6;
  --atk:#E2714A; --atk-soft:#FBE7DF; --heal:#36A46F; --heal-soft:#DDF1E6; --shield:#3E93C9; --shield-soft:#DDEDF7; --crit:#D9A21F; --crit-soft:#F8EDCF;
  --rv:#8B5CC9; --rv-soft:#EEE5F8;
  --bad:#C0564A; --bad-soft:#F6E1DD; --ok:#2F8F5E; --ok-soft:#DFF1E6; --code:#EEF3F1;
  --kw:#2F7368; --str:#9A6234; --type:#4F64A8; --num:#8A4F8C; --com:#86948E;
  --f-ui:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Russo One","Noto Sans Georgian",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--panel)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
h1,h2,h3,p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}

/* ---------- arena ---------- */
.arena{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:clamp(230px,44vh,430px);background:var(--night);overflow:hidden;box-shadow:0 6px 18px -10px rgba(10,20,25,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding-top:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none;color:var(--hud-ink)}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side.r{align-items:flex-end}
.hp{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:330px;width:100%}
.side.r .hp{align-items:flex-end;text-align:right}
.hp-top{display:flex;align-items:baseline;gap:8px;width:100%;min-width:0}
.side.r .hp-top{flex-direction:row-reverse}
.nm{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.you{font-size:.68rem;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:0 7px;opacity:.85;flex:none;margin-left:4px}
.hpn{font-family:var(--f-num);font-size:.95rem;margin-left:auto;font-variant-numeric:tabular-nums;flex:none}
.side.r .hpn{margin-left:0;margin-right:auto}
.bar{position:relative;height:12px;width:100%;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.hp.mini .bar{height:8px}
.hp.mini .nm,.hp.mini .hpn{font-size:.8rem}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.side.r .bar i{inset:0 0 0 auto}
.bar .chip{background:#F6E7C8;transition:width .55s ease .28s}
.bar .fill{transition:width .18s ease-out;background:linear-gradient(90deg,#1F8E7E,var(--p1))}
.side.r .bar .fill{background:linear-gradient(270deg,#4662C4,var(--p2))}
.hp.boss .bar{height:15px}
.hp.boss .bar .fill{background:linear-gradient(270deg,#6B3F8E,#B070D8)!important}
.bar.low .fill{background:linear-gradient(90deg,#B9513F,#E2714A)!important}
.sub{display:flex;gap:6px;align-items:center;font-size:.74rem;opacity:.85;min-height:18px}
.side.r .sub{flex-direction:row-reverse}
.pips{display:flex;gap:3px}
.pips b{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.16)}
.pips b.on{background:#F0B84A;box-shadow:0 0 8px #F0B84A}
.pips.full b{background:#FF8A4C;box-shadow:0 0 10px #FF8A4C}
.shd{display:none;font-size:.7rem;font-weight:700;color:#BFE3FA;border:1px solid rgba(160,210,245,.6);border-radius:999px;padding:0 7px}
.shd.on{display:inline-block}
.hp.shake{animation:hshake .32s}
@keyframes hshake{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.clock{font-family:var(--f-num);font-size:1.25rem;padding:3px 12px;border-radius:10px;background:rgba(6,14,18,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-variant-numeric:tabular-nums;text-align:center;min-width:72px}
.clock.hot{color:#FFB070;box-shadow:inset 0 0 0 1px rgba(255,150,90,.5)}
.clock:empty{visibility:hidden}
.banner{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.9);font-family:var(--f-num);font-size:clamp(1.6rem,6vw,3.2rem);color:#FFF6E3;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 26px rgba(255,190,110,.5);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);text-align:center}
.banner.ka{font-family:var(--f-ui);font-weight:800}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.small{font-size:clamp(1rem,3.6vw,1.6rem);white-space:normal;max-width:90%}
.snd{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;gap:6px}
.snd button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(6,14,18,.45);color:var(--hud-ink);display:grid;place-items:center;padding:0}
.snd button[aria-pressed="false"]{opacity:.5}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.emotes{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;gap:6px}
.emotes button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(6,14,18,.45);font-size:1.15rem;line-height:1;padding:0;transition:transform .1s}
.emotes button:active{transform:scale(.9)}
.emotes[hidden]{display:none}

/* ---------- panel ---------- */
.panel{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 17px;border-radius:999px;font-weight:600;transition:transform .12s,border-color .2s,filter .2s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.25)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:0}
input[type=text]:focus{outline:none;border-color:var(--p1);box-shadow:0 0 0 3px rgba(47,179,159,.2)}
.err{color:var(--bad);min-height:1.4em;font-size:.92rem}
.note{color:var(--muted);font-size:.9rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-weight:700;font-size:.92rem}

.home{display:flex;flex-direction:column;gap:18px}
.intro{display:flex;flex-direction:column;gap:6px}
.intro h1{font-weight:800;font-size:clamp(1.6rem,4.5vw,2.3rem);letter-spacing:-.01em;text-wrap:balance}
.intro p{color:var(--muted);max-width:66ch}
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-width:0;position:relative}
.hero i{width:16px;height:16px;border-radius:50%;display:block;margin-bottom:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.hero b{font-size:.95rem}
.hero span{font-size:.78rem;color:var(--muted)}
.hero small{font-size:.76rem;color:var(--ink);font-weight:600}
.hero[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.86rem;font-weight:500}
.chipb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.act h2{font-size:1.02rem;font-weight:700}
.act p{color:var(--muted);font-size:.88rem;flex:1}
.act .row{display:flex;gap:8px;flex-wrap:wrap}
.act.boss{background:linear-gradient(160deg,#F3ECFA,#FFFFFF 60%);border-color:#D9CBEA}
.join-row{display:flex;gap:8px;flex-wrap:wrap}
.join-row input{flex:1 1 100px;text-transform:uppercase;letter-spacing:.28em;font-family:var(--f-mono)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);min-width:0}
.rule .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.rule b{display:block;font-size:.93rem}
.rule small{color:var(--muted);font-size:.82rem;display:block}
.rule.atk .ri{background:var(--atk)} .rule.heal .ri{background:var(--heal)} .rule.shield .ri{background:var(--shield)} .rule.crit .ri{background:var(--crit)}
.extra{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted)}
.extra span{display:inline-flex;gap:6px;align-items:center}
.extra i{width:8px;height:8px;border-radius:2px;display:inline-block;background:#F0A040}
.medals{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.medal .me{font-size:1.5rem;line-height:1.2}
.medal b{font-size:.78rem}
.medal small{font-size:.7rem;color:var(--muted)}
.medal.off{opacity:.45;filter:grayscale(1)}
.medal.new{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}

.lobby{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding-top:6px}
.room-code{font-family:var(--f-mono);font-size:clamp(2rem,9vw,3rem);letter-spacing:.3em;padding-left:.3em;font-weight:500}
.vs{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:1.1rem}
.vs .v{color:var(--muted);font-weight:500;font-size:.9rem}
.vs .p1{color:#1E8A7B} .vs .p2{color:#4C67C9}
.vs .wait{color:var(--muted);font-weight:500}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* fight */
.fight{display:flex;flex-direction:column;gap:12px}
.learn{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-height:48px}
.learn .li{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.learn .lt{min-width:0;font-size:.9rem}
.learn .lt b{display:block;font-size:.88rem}
.learn .lt span{color:var(--muted)}
.learn.pop{animation:fresh .35s ease-out}
.tabs{display:none;gap:6px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.84rem;position:relative;min-width:0}
.tab .tv{font-family:var(--f-num);font-size:.76rem;opacity:.75}
.tab.atk{--c:var(--atk)} .tab.heal{--c:var(--heal)} .tab.shield{--c:var(--shield)} .tab.crit{--c:var(--crit)}
.tab svg{color:var(--c)}
.tab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.tab.lockd::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.tab.rvd::before{content:"×2";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:.62rem;font-family:var(--f-num);background:var(--rv);color:#fff;border-radius:999px;padding:0 6px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.qc{--c:var(--atk);--cs:var(--atk-soft);position:relative;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.qc.heal{--c:var(--heal);--cs:var(--heal-soft)} .qc.shield{--c:var(--shield);--cs:var(--shield-soft)} .qc.crit{--c:var(--crit);--cs:var(--crit-soft)}
.qc.rv{box-shadow:0 0 0 2px var(--rv)}
.qc header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cs);font-weight:700;flex-wrap:wrap}
.qc header svg{color:var(--c)}
.qc .val{font-family:var(--f-num);font-size:.9rem;color:var(--c);filter:brightness(.85)}
.qc .rvb{display:none;font-size:.7rem;font-weight:700;color:#fff;background:var(--rv);border-radius:999px;padding:1px 8px}
.qc.rv .rvb{display:inline-block}
.qc .tag{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--bad);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qc.fresh .qbody{animation:fresh .35s ease-out}
@keyframes fresh{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qp{font-weight:600;font-size:.98rem;line-height:1.5}
pre.code{margin:0;background:var(--code);border:1px solid var(--line);border-radius:9px;padding:9px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:.78rem;line-height:1.6;white-space:pre}
.t-kw{color:var(--kw);font-weight:500} .t-str{color:var(--str)} .t-type{color:var(--type)} .t-num{color:var(--num)} .t-com{color:var(--com);font-style:italic}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--c);background:#fff}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .ok{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.76rem;background:#fff;border:1px solid var(--line);color:var(--muted)}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.92rem}
.opt:disabled{opacity:.55}
.opt.picked{border-color:var(--ink);opacity:1}
.qc.locked .opt.picked{border-color:var(--bad);background:var(--bad-soft)}
.lockmsg{display:none;font-size:.85rem;color:#8E3B31;background:var(--bad-soft);border-radius:8px;padding:8px 10px}
.lockmsg b{display:block;color:var(--bad)}
.qc.locked .lockmsg{display:block}
.qc.shake{animation:hshake .35s}
.claim{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:16px;background:rgba(255,255,255,.9);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
.claim.show{opacity:1}
.claim b{font-size:1.05rem}
.claim span{font-size:.86rem;color:var(--muted)}
.claim.me b{color:var(--ok)} .claim.op b{color:var(--atk)}
.hint{font-size:.85rem;color:var(--muted);text-align:center}

/* end */
.endp{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.endp h2{font-weight:800;font-size:clamp(1.5rem,4.5vw,2.1rem)}
.res{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);width:min(100%,600px);font-size:.92rem}
.res div{padding:8px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.res div.l{text-align:left;color:var(--muted)}
.res div.hd{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res div.last{border-bottom:0}
.earned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.earned .medal{flex-direction:row;gap:8px;padding:8px 12px}
.earned .medal small{font-size:.74rem}
.review{width:min(100%,760px);display:flex;flex-direction:column;gap:10px;text-align:left}
.review h3{font-size:1.05rem;font-weight:800;text-align:center}
.rv-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rv-item .q{font-weight:600}
.rv-item .yours,.rv-item .right{font-size:.88rem;border-radius:8px;padding:7px 10px}
.rv-item .yours{background:var(--bad-soft);color:#8E3B31}
.rv-item .right{background:var(--ok-soft);color:#1F5E3D}
.rv-item .yours b,.rv-item .right b{display:block}
.end-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@media (max-width:1119px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .medals{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){ .setup{grid-template-columns:1fr} .rules{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  .tabs{display:flex}
  .cards{grid-template-columns:1fr}
  .cards[data-tab="0"] .qc:not([data-sl="0"]),
  .cards[data-tab="1"] .qc:not([data-sl="1"]),
  .cards[data-tab="2"] .qc:not([data-sl="2"]),
  .cards[data-tab="3"] .qc:not([data-sl="3"]){display:none}
  .arena{height:clamp(210px,38vh,330px)}
  .nm{font-size:.85rem}
  .clock{font-size:1.05rem;min-width:60px;padding:2px 8px}
  .sub .rl{display:none}
}
@media (max-width:560px){
  .actions,.rules{grid-template-columns:1fr}
  .heroes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab .tv{display:none}
  .emotes button{width:32px;height:32px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="arena" id="arena">
  <canvas id="cv" aria-label="საბრძოლო არენა" role="img"></canvas>
  <div class="hud" id="hud"></div>
  <div class="banner" id="banner"></div>
  <div class="emotes" id="emotes" hidden></div>

    + '<div class="intro"><h1>Bytefight არენა</h1><p>ორი მოთამაშე, ოთხი კითხვა ერთდროულად. ვინც პირველი უპასუხებს სწორად, მისი გმირი მოქმედებს. ყოველი პასუხის შემდეგ ხედავ, რატომ არის ის სწორი, ბოლოს კი შენს შეცდომებს ერთად გადახედავ.</p></div>'
    + '<div class="setup">'
    +   '<div class="field"><label class="lbl" for="in-name">შენი სახელი</label><input type="text" id="in-name" maxlength="18" autocomplete="nickname" placeholder="მაგ. ანა" value="' + esc(myName) + '">'
    +   '<span class="lbl">თემა</span><div class="chips" id="topics">' + topics + '</div></div>'
    +   '<div class="field"><span class="lbl">აირჩიე გმირი</span><div class="heroes" id="heroes">' + heroes + '</div></div>'
    + '</div>'
    + '<div class="actions">'
    +   '<div class="act"><h2>დუელი მეგობართან</h2><p>შექმენი ოთახი და კოდი გაუგზავნე. ბრძოლა დაიწყება, როგორც კი შემოვა.</p><div class="row"><button class="btn primary" id="btn-create">ოთახის შექმნა</button></div></div>'
    +   '<div class="act"><h2>შემოსვლა კოდით</h2><p>ჩაწერე კოდი მეგობრის ეკრანიდან.</p><div class="join-row"><input type="text" id="in-code" maxlength="5" placeholder="K7QPM" autocomplete="off" spellcheck="false" aria-label="ოთახის კოდი"><button class="btn" id="btn-join">შესვლა</button></div></div>'
    +   '<div class="act"><h2>დუელი ბოტთან</h2><p>ვარჯიში შემთხვევით გმირთან. ბოტი თავის სიჩქარეს შენზე არგებს.</p><div class="row"><button class="btn" id="btn-bot">ბრძოლა</button></div></div>'
    +   '<div class="act boss"><h2>ბოსი ბაგი</h2><p>დიდი ხოჭო ყოველ რამდენიმე წამში გიტევს. დაამარცხე მარტო ან მეგობართან ერთად.</p><div class="row"><button class="btn" id="btn-boss-solo">მარტო</button><button class="btn" id="btn-boss-coop">მეგობართან ერთად</button></div></div>'
    + '</div>'
    + '<p class="err" id="home-err"></p>'
    + '<div class="rules">'
    +   '<div class="rule atk"><span class="ri">' + ICON.atk + '</span><span><b>შეტევა · ' + ATK + ' ზიანი</b><small>მარტივი კითხვა</small></span></div>'
    +   '<div class="rule heal"><span class="ri">' + ICON.heal + '</span><span><b>სიცოცხლე · +' + HEAL + '</b><small>საშუალო კითხვა</small></span></div>'
    +   '<div class="rule shield"><span class="ri">' + ICON.shield + '</span><span><b>ფარი · ბლოკავს დარტყმას</b><small>საშუალო კითხვა</small></span></div>'
    +   '<div class="rule crit"><span class="ri">' + ICON.crit + '</span><span><b>კრიტიკული · ' + CRIT + ' ზიანი</b><small>რთული კითხვა კოდით</small></span></div>'
    + '</div>'
    + '<div class="extra"><span><i></i>3 სწორი ზედიზედ: ×1.5</span><span><i></i>ბოლო 30 წამში ზიანი ×1.5</span><span><i style="background:var(--rv)"></i>შეცდომის კითხვა ბრუნდება „რევანშად" ×2</span><span><i></i>არასწორი პასუხი ამ ბარათს გიბლოკავს</span></div>'
    + '<div class="field"><span class="lbl">შენი მედლები · ' + myMedals.length + ' / ' + MEDALS.length + '</span><div class="medals">' + medals + '</div></div>'
    + '</section>';
}
function lobbyHTML(){
  const boss = S.mode === 'boss';
  return '<section class="lobby"><span class="eyebrow">' + (boss ? 'ბოსის ოთახი' : 'დუელის ოთახი') + ' · კოდი</span><span class="room-code" id="room-code">' + esc(S.code) + '</span>'
    + '<button class="btn" id="btn-copy">კოდის კოპირება</button>'
    + '<p class="note">მეგობარმა გახსნას ეს გვერდი თავისი claude.ai ანგარიშით, აირჩიოს გმირი და შეიყვანოს კოდი. ' + (boss ? 'ერთად დაუპირისპირდებით ბაგს.' : 'ბრძოლა ავტომატურად დაიწყება.') + '</p>'
    + '<div class="vs"><span class="p1">' + esc(nm('h')) + '</span><span class="v">' + (boss ? 'და' : 'vs') + '</span><span class="p2 wait">ველოდებით<span class="dots"></span></span></div>'
    + '<button class="link" id="btn-leave">გასვლა</button></section>';
}
function fightHTML(){
  const hero = S.hero[role] || myHero;
  const tabs = SLOT.map((s, i) => '<button class="tab ' + s.k + '" role="tab" id="tab-' + i + '" data-t="' + i + '" aria-selected="' + (i === tab) + '">' + ICON[s.k] + '<span>' + s.name + '</span><span class="tv">' + slotVal(i, hero) + '</span></button>').join('');
  const cards = SLOT.map((s, i) => '<article class="qc ' + s.k + '" id="qc-' + i + '" data-sl="' + i + '"><header>' + ICON[s.k] + '<span>' + s.name + '</span><span class="val">' + slotVal(i, hero) + '</span><span class="rvb">რევანში ×2</span><span class="tag" id="tag-' + i + '"></span></header><div class="qbody"></div><div class="claim" id="claim-' + i + '"></div></article>').join('');
  return '<section class="fight">'
    + '<div class="learn" id="learn"><span class="li">' + ICON.bulb + '</span><span class="lt"><b>აქ გამოჩნდება ახსნა</b><span>ყოველი აღებული ბარათის შემდეგ ნახავ სწორ პასუხს და მიზეზს.</span></span></div>'
    + '<div class="tabs" role="tablist">' + tabs + '</div><div class="cards" id="cards" data-tab="' + tab + '">' + cards + '</div>'
    + '<p class="hint">ვინც პირველი უპასუხებს სწორად, ის იღებს ბარათს. შეცდომის შემდეგ ამ ბარათზე ვეღარ უპასუხებ, დანარჩენი სამი კი ღიაა.</p></section>';
}
function cardBody(cd){
  const q = BANK[cd.q], perm = cd.o.split('').map(Number);
  return '<p class="qp">' + fmt(q.p) + '</p>' + (q.code ? '<pre class="code">' + hl(q.code) + '</pre>' : '')
    + '<div class="opts">' + perm.map((oi, i) => '<button class="opt" data-c="' + oi + '"><span class="ok">' + 'ABCD'[i] + '</span><span class="ot">' + fmt(q.o[oi]) + '</span></button>').join('') + '</div>'
    + '<p class="lockmsg" id="lm-' + cd.q + '"></p>';
}
function endHTML(){
  const boss = S.mode === 'boss', me = role, ps = players(), e = S.end || {};
  let title, why;
  if (boss) {
    title = e.w === 'team' ? 'ბაგი დამარცხდა!' : 'ბაგმა გაიმარჯვა';
    why = e.why === 'boss' ? 'გუნდის გამარჯვება' : e.why === 'time' ? 'დრო ამოიწურა' : e.why === 'left' ? 'მეგობარი გავიდა' : 'ყველა დაეცა';
  } else {
    title = e.w === 'd' ? 'ფრე!' : e.w === me ? 'შენ მოიგე!' : nm(e.w) + ' იმარჯვებს';
    why = e.why === 'ko' ? 'ნოკაუტით' : e.why === 'left' ? 'მოწინააღმდეგე გავიდა' : 'დრო ამოიწურა, მეტი სიცოცხლე დარჩა';
  }
  const cols = ps.length, grid = 'grid-template-columns:auto repeat(' + cols + ',minmax(0,1fr))';
  const rows = [
    ['დარჩენილი სიცოცხლე', p => S.hp[p]], ['სწორი პასუხები', p => S.sc[p].ok], ['შეცდომები', p => S.sc[p].bad],
    ['მიყენებული ზიანი', p => S.sc[p].dmg], ['კრიტიკული დარტყმები', p => S.sc[p].crit], ['განკურნება', p => S.sc[p].heal], ['დაბლოკილი', p => S.sc[p].blk],
  ];
  let table = '<div class="res" style="' + grid + '"><div class="l"></div>' + ps.map(p => '<div class="hd" style="color:' + (p === 'h' ? '#1E8A7B' : '#4C67C9') + '">' + esc(nm(p)) + '</div>').join('');
  rows.forEach((r, i) => { const last = i === rows.length - 1 ? ' last' : ''; table += '<div class="l' + last + '">' + r[0] + '</div>' + ps.map(p => '<div class="' + last + '">' + r[1](p) + '</div>').join(''); });
  table += '</div>';
  const mine = medalsOf(me);
  const earned = mine.length ? '<div class="earned">' + mine.map(id => { const m = MEDALS.find(x => x.id === id); return '<div class="medal' + (newMedals.includes(id) ? ' new' : '') + '"><span class="me">' + m.e + '</span><span><b>' + m.n + '</b><br><small>' + (newMedals.includes(id) ? 'ახალი მედალი!' : m.d) + '</small></span></div>'; }).join('') + '</div>' : '<p class="note">ამ ბრძოლაში მედალი არ აგიღია. მედლების სია მთავარ გვერდზეა.</p>';
  const review = mistakes.length
    ? '<div class="review"><h3>შენი შეცდომები · ' + mistakes.length + '</h3>' + mistakes.map(m => {
        const q = BANK[m.q]; if (!q) return '';
        return '<div class="rv-item"><p class="q">' + fmt(q.p) + '</p>' + (q.code ? '<pre class="code">' + hl(q.code) + '</pre>' : '')
          + '<div class="yours"><b>შენ: ' + fmt(q.o[m.c]) + '</b>' + fmt(q.w[m.c] || '') + '</div>'
          + '<div class="right"><b>სწორი: ' + fmt(q.o[q.c]) + '</b>' + fmt(q.x) + '</div></div>';
      }).join('') + '</div>'
    : '<p class="note">შეცდომა არ დაგიშვია. ყოჩაღ! 🎉</p>';
  return '<section class="endp"><p class="eyebrow">' + esc(why) + '</p><h2>' + esc(title) + '</h2>' + table + earned
    + '<div class="end-actions">' + (role === 'h' ? '<button class="btn primary" id="btn-again">' + (boss ? 'ხელახლა ბაგთან' : 'რევანში') + '</button>' : '<p class="note">ახალ ბრძოლას მასპინძელი იწყებს.</p>')
    + '<button class="btn" id="btn-home">მთავარზე</button></div>' + review + '</section>';
}
function bind(sc){
  const on = (s, ev, fn) => { const el = $(s); if (el) el.addEventListener(ev, fn); };
  if (sc === 'home') {
    on('#btn-create', 'click', () => createGame('duel')); on('#btn-join', 'click', joinGame); on('#btn-bot', 'click', () => startLocal('duel'));
    on('#btn-boss-solo', 'click', () => startLocal('boss')); on('#btn-boss-coop', 'click', () => createGame('boss'));
    on('#in-code', 'input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
    on('#in-code', 'keydown', e => { if (e.key === 'Enter') joinGame(); });
    on('#in-name', 'input', e => { myName = clean(e.target.value).slice(0, 18); store.set('bfa-name', myName); });
    $$('#heroes .hero').forEach(b => b.addEventListener('click', () => {
      myHero = b.dataset.h; store.set('bfa-hero', myHero);
      $$('#heroes .hero').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (homeRival === myHero) homeRival = null;
      setupHomeFighters(); updateHud(); sfx.card(); showEmote('h', '🔥');
    }));
    $$('#topics .chipb').forEach(b => b.addEventListener('click', () => {
      myTopic = b.dataset.t; store.set('bfa-topic', myTopic);
      $$('#topics .chipb').forEach(x => x.setAttribute('aria-pressed', String(x === b))); sfx.card();
    }));
  }
  if (sc === 'wait') on('#btn-cancel', 'click', resetHome);
  if (sc === 'lobby') {
    on('#btn-leave', 'click', resetHome);
    on('#btn-copy', 'click', e => {
      const b = e.currentTarget, done = () => { b.textContent = 'დაკოპირდა'; setTimeout(() => b.textContent = 'კოდის კოპირება', 1500); };
      try { navigator.clipboard.writeText(S.code).then(done, selCode); } catch { selCode(); }
    });
  }
  if (sc === 'fight') {
    $$('.tab').forEach(b => b.addEventListener('click', () => { tab = Number(b.dataset.t); $('#cards').dataset.tab = tab; $$('.tab').forEach(x => x.setAttribute('aria-selected', String(x === b))); sfx.card(); }));
  }
  if (sc === 'end') {
    on('#btn-again', 'click', () => { if (role === 'h') { newMedals = []; startCountdown(); } });
    on('#btn-home', 'click', () => { newMedals = []; resetHome(); });
  }
}
function selCode(){ const el = $('#room-code'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function update(sc){
  if (sc === 'home') { const e = $('#home-err'); if (e) e.textContent = homeErr; return; }
  if (sc === 'lobby') {
    const g = $('.vs .p2'); if (!g) return;
    if (S.names.g) { g.classList.remove('wait'); g.textContent = S.names.g; } else { g.classList.add('wait'); g.innerHTML = 'ველოდებით<span class="dots"></span>'; }
    return;
  }
  if (sc === 'fight') updateCards();
}
function updateCards(){
  if (!S || !S.cards) return;
  const me = role, others = players().filter(p => p !== me);
  for (let sl = 0; sl < 4; sl++) {
    const el = $('#qc-' + sl), cd = S.cards[sl]; if (!el) continue;
    const body = $('.qbody', el);
    if (!cd) { if (cardKey[sl] !== 'wait') { cardKey[sl] = 'wait'; body.innerHTML = '<p class="note">კითხვა გამოჩნდება ათვლის შემდეგ.</p>'; } continue; }
    if (cardKey[sl] !== cd.q) {
      cardKey[sl] = cd.q; pend[sl] = null;
      body.innerHTML = cardBody(cd);
      $$('.opt', body).forEach(b => b.addEventListener('click', () => { b.classList.add('picked'); answer(sl, cd.q, Number(b.dataset.c)); }));
      el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh');
    }
    el.classList.toggle('rv', !!cd.r);
    const t = $('#tab-' + sl); if (t) t.classList.toggle('rvd', !!cd.r);
    const locked = cd.lk.includes(me), lockKey = sl + ':' + cd.q;
    if (locked && !lockSeen.has(lockKey)) {
      lockSeen.add(lockKey); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      const lp = lastPick[sl], q = BANK[cd.q];
      if (lp && lp.q === cd.q) {
        mistakes.push({q:cd.q, c:lp.c});
        const lm = $('.lockmsg', el);
        if (lm) lm.innerHTML = '<b>„' + fmt(q.o[lp.c]) + '" არასწორია</b>' + fmt(q.w[lp.c] || 'სცადე სხვა ბარათი.') + ' სწორ პასუხს ბარათის აღების შემდეგ ნახავ.';
        $$('.opt', el).forEach(b => b.classList.toggle('picked', Number(b.dataset.c) === lp.c));
      } else {
        const lm = $('.lockmsg', el); if (lm) lm.innerHTML = '<b>შეცდი.</b>სცადე სხვა ბარათი.';
      }
    }
    el.classList.toggle('locked', locked);
    const dis = S.ph !== 'fight' || locked || pend[sl] === cd.q || !alive(me);
    $$('.opt', el).forEach(b => { b.disabled = dis; if (!dis) b.classList.remove('picked'); });
    const wrongOthers = others.filter(p => cd.lk.includes(p));
    const tagTxt = wrongOthers.length ? wrongOthers.map(nm).join(', ') + '-მ შეცდა' : '';
    const tag = $('#tag-' + sl); if (tag.textContent !== tagTxt) tag.textContent = tagTxt;
    if (t) t.classList.toggle('lockd', locked);
  }
}

render();
requestAnimationFrame(frame);
</script>
